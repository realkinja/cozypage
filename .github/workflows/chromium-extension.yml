name: Export and pack Chromium extension

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

concurrency:
  group: "chromium-extension"
  cancel-in-progress: false

jobs:
  build-cozypages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup PNPM
        uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@24
      - name: Get PNPM store path
        id: pnpm-store
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: |
            .next/cache
            ${{ steps.pnpm-store.outputs.STORE_PATH }}
          # Generate a new cache whenever packages or source files change.
          key: pnpm-cache-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            pnpm-cache-${{ runner.os }}-
      - name: Build with Next.js
        run: pnpm next build
      - name: Upload static export artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-export
          path: |
            out/*
            manifest.json

  build-extension:
    runs-on: ubuntu-latest
    needs: build-cozypages
    steps:
      - name: Download static export artifact
        uses: actions/download-artifact@v5
        with:
          name: static-export
      - name: Move and sanitize static export
        shell: bash
        run: |
          mv out/* .
          rm -r out
          for f in _*; do [ -e "$f" ] && mv "$f" "static$f"; done
          find . -type f -exec sed -i 's#/_next/#/static_next/#g' {} +
      - name: Setup Chromium
        run: |
          export REVISION=$(curl -s -S "https://www.googleapis.com/download/storage/v1/b/chromium-browser-snapshots/o/Linux_x64%2FLAST_CHANGE?alt=media")
          curl "https://www.googleapis.com/download/storage/v1/b/chromium-browser-snapshots/o/Linux_x64%2F$REVISION%2Fchrome-linux.zip?alt=media" -o $RUNNER_TEMP/$REVISION-chrome-linux.zip
          cd $RUNNER_TEMP
          unzip $REVISION-chrome-linux.zip
      - name: Pack extension
        id: crx
        shell: bash
        run: |
          export PATH="$RUNNER_TEMP/chrome-linux:$PATH"
          chrome --no-sandbox --pack-extension=$(pwd)
          echo "OUT=$(find ../ -type f -name '*.crx' -print | xargs readlink -f)" >> "$GITHUB_OUTPUT"
      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: chromium-extension
          path: ${{ steps.crx.outputs.out }}

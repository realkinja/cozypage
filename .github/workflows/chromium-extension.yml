name: Export and pack Chromium extension

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

concurrency:
  group: "chromium-extension"
  cancel-in-progress: false

jobs:
  build-cozypages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup PNPM
        uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@24
      - name: Get PNPM store path
        id: pnpm-store
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: |
            .next/cache
            ${{ steps.pnpm-store.outputs.STORE_PATH }}
          # Generate a new cache whenever packages or source files change.
          key: pnpm-cache-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            pnpm-cache-${{ runner.os }}-
      - name: Build with Next.js
        run: pnpm next build
      - name: Upload static export artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-export
          path: |
            out/*
            manifest.json

  build-extension:
    runs-on: ubuntu-latest
    needs: build-cozypages
    steps:
      - name: Download static export artifact
        uses: actions/download-artifact@v5
        with:
          name: static-export
      - name: Check working directory content
        shell: bash
        run: |
          ls $GITHUB_WORKSPACE
